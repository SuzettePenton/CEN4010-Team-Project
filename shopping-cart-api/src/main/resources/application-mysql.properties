# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Prefer environment variables instead of committing a real password.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/team8_bookstore?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

