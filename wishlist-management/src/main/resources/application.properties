spring.application.name=wishlist-service

# Local MySQL. The app creates the database and tables on first start.
spring.datasource.url=jdbc:mysql://localhost:3306/wishlist_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# The password comes from the DB_PASSWORD environment variable, never from this file.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Other features use 8080 (ratings) and 8081 (cart), so the wish list uses 8082.
server.port=8082
