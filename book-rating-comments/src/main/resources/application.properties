spring.application.name=bookstore

# Local MySQL: the bookstore database
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# The password comes from the DB_PASSWORD Windows variable, never from this file
spring.datasource.password=${DB_PASSWORD}

# Create or update the ratings and comments tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
